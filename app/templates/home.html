{% extends "base.html" %}
{% block title %}主頁{% endblock %}
{% block content %}
<nav class="top">
  <a href="{{ url_for('users.profile', user_id=g.user.id) }}">我的個人頁</a>
  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button>登出</button>
  </form>
</nav>
<p class="actions">
  <a class="button" href="{{ url_for('restaurants.index', scope='mine') }}">我的餐廳</a>
  <a class="button secondary" href="{{ url_for('restaurants.index', scope='public') }}">公用餐廳</a>
  <a class="button secondary" href="{{ url_for('restaurants.index', scope='favorites') }}">♥ 我的收藏</a>
  <a class="button secondary" href="{{ url_for('restaurants.new') }}">＋ 新增餐廳</a>
</p>
{% endblock %}
